name: Patch Medrastak Full
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download tools
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          chmod +x apktool && sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
      - name: Decompile APK
        run: apktool d Medrastak_7.0.0.apk -o out
      - name: Patch PairIP
        run: |
          python3 -c "
          import os
          for root, dirs, files in os.walk('out'):
            for f in files:
              if f == 'Application.smali' and 'pairip' in root:
                path = os.path.join(root, f)
                lines = open(path).readlines()
                new_lines = [l for l in lines if 'checkLicense' not in l]
                open(path, 'w').writelines(new_lines)
                print('Patched:', path)
          "
      - name: Patch libapp.so strings
        run: |
          python3 -c "
          data = bytearray(open('out/lib/armeabi-v7a/libapp.so','rb').read())
          patches = [(0x004cc144,b'not_subscribed\x00',b'yes_subscribed\x00'),(0x00564254,b'not_paid\x00',b'yes_paid\x00'),(0x0054c1f4,b'notPaid\x00',b'yesPaid\x00'),(0x00514f64,b'Not Paid\x00',b'Yes Paid\x00')]
          for off,old,new in patches:
            found=data[off:off+len(old)]
            if found==old:
              data[off:off+len(new)]=new
              print('OK',old.rstrip(b'\x00').decode())
            else:
              print('MISS',hex(off),found[:8])
          open('out/lib/armeabi-v7a/libapp.so','wb').write(data)
          "
      - name: Add NSC
        run: |
          mkdir -p out/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted="true">\n        <trust-anchors>\n            <certificates src="system"/>\n            <certificates src="user"/>\n        </trust-anchors>\n    </base-config>\n</network-security-config>\n' > out/res/xml/network_security_config.xml
      - name: Patch Manifest
        run: |
          python3 -c "
          c=open('out/AndroidManifest.xml').read()
          if 'networkSecurityConfig' not in c:
            c=c.replace('<application ','<application android:networkSecurityConfig=\"@xml/network_security_config\" ',1)
            open('out/AndroidManifest.xml','w').write(c)
            print('patched')
          "
      - name: Rebuild
        run: apktool b out -o unsigned.apk
      - name: Sign
        run: |
          mkdir signed
          java -jar signer.jar --apks unsigned.apk --out signed/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: medrastak-patched
          path: signed/*.apk
